name: frontend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - './**'
      - '.github/workflows/frontend-pipeline.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - './**'

env:
  WORKING_DIR:        .
  REGISTRY_HOST:      ${{ vars.REGISTRY_HOST || 'docker.io' }}
  REGISTRY_USERNAME:  ${{ secrets.REGISTRY_USERNAME }}
  REGISTRY_PASSWORD:  ${{ secrets.REGISTRY_PASSWORD }}
  IMAGE_TAG:          ${{ vars.IMAGE_TAG || github.sha }}
  ENABLE_DEPLOY:      ${{ vars.ENABLE_DEPLOY || 'false' }}

jobs:
  test:
    name: Tests unitaires et sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: |
          npm ci
          npm test -- --watch=false

  build:
    name: Build — frontend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: |
          npm ci
          npm run build

  package:
    name: Package — frontend
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: |
          npm ci
          npm run build
          npm pack

  upload_artifact:
    name: Upload artifact
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact
          path: ${{ env.WORKING_DIR }}/*.tgz

  security_scan:
    name: Analyse de sécurité
    runs-on: ubuntu-latest
    needs: upload_artifact
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-artifact
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: |
          npm ci
          npm audit --json --output=/tmp/audit.json
      - name: Upload security report
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: /tmp/audit.json

  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    needs: security_scan
    if: github.ref == 'refs/heads/main' && env.ENABLE_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: |
          kubectl apply -f ${{ env.WORKING_DIR }}/deployment.yaml
          kubectl rollout status deployment/frontend -n default --timeout=5m